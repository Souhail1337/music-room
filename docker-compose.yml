name: music-room

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicroom}
      POSTGRES_DB: ${POSTGRES_DB:-musicroom}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-musicroom}:${POSTGRES_PASSWORD:-musicroom}@postgres:5432/${POSTGRES_DB:-musicroom}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health',{headers:{'x-internal-probe':'1'}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  pgdata:
